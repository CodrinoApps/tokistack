[package]
name = "core-rs"
version = "1.0.0"
edition = "2024"

[features]
default = []
cluster = ["dep:thiserror"]
admin = ["dep:serde"]
ssm = ["dep:aws-sdk-ssm", "dep:thiserror"]
instrumentation = [
  "cluster",
  "dep:lambda_runtime",
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry-appender-tracing",
  "dep:tracing-opentelemetry",
  "dep:tracing-subscriber",
]

[dependencies]
aws-sdk-ssm = { workspace = true, optional = true }
lambda_runtime = { workspace = true, features = ["opentelemetry"], optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry-appender-tracing = { version = "0.32.0", optional = true }
opentelemetry-otlp = { version = "0.32.0", features = ["http-proto", "reqwest-blocking-client"], optional = true }
opentelemetry_sdk = { version = "0.32.1", optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing-opentelemetry = { version = "0.33.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"], optional = true }

[dev-dependencies]
opentelemetry_sdk = { version = "0.32.1", features = ["testing"] }
