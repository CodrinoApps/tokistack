[workspace]
members = [
  "apps/admin",
  "apps/admin-cli",
  "packages/admin-core",
]
resolver = "3"

[workspace.dependencies]
admin-core = { path = "packages/admin-core" }
anyhow = "1.0"
aws-config = { version = "1.8.17", features = ["behavior-version-latest"] }
lambda_runtime = "1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
